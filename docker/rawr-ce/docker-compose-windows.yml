# Run with: docker compose -f docker-compose.windows.yml up [msvc-16|msvc-17]
# Requires Docker Desktop in Windows containers mode.

version: "3.9"

services:

  msvc-16:
    build:
      context: .
      dockerfile: msvc/msvc.Dockerfile
      args:
        # VS 2019 Build Tools = MSVC 16.x
        VS_YEAR: "2019"
        VS_CHANNEL_URL: "https://aka.ms/vs/16/release/channel"
        VS_INSTALLER_URL: "https://aka.ms/vs/16/release/vs_buildtools.exe"
    container_name: rawr-msvc-16
    environment:
      COMPILER_ID: msvc-16
      RAWR_MODULE_IFACE: ${RAWR_MODULE_IFACE:-src/rawr.cppm}
    volumes:
      - ${RAWR_SOURCE_WIN:?Set RAWR_SOURCE_WIN in .env (Windows path, e.g. C:\projects\rawr)}:C:\workspace:ro
      - msvc16-build:C:\build
      - msvc16-mods:C:\rawr-modules
    restart: "no"

  msvc-17:
    build:
      context: .
      dockerfile: msvc/msvc.Dockerfile
      args:
        VS_YEAR: "2022"
        VS_CHANNEL_URL: "https://aka.ms/vs/17/release/channel"
        VS_INSTALLER_URL: "https://aka.ms/vs/17/release/vs_buildtools.exe"
    container_name: rawr-msvc-17
    environment:
      COMPILER_ID: msvc-17
      RAWR_MODULE_IFACE: ${RAWR_MODULE_IFACE:-src/rawr.cppm}
    volumes:
      - ${RAWR_SOURCE_WIN:?Set RAWR_SOURCE_WIN in .env}:C:\workspace:ro
      - msvc17-build:C:\build
      - msvc17-mods:C:\rawr-modules
    restart: "no"

volumes:
  msvc16-build:
  msvc17-build:
  msvc16-mods:
  msvc17-mods:
